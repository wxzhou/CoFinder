appId: com.wxzhou.cofinder
productName: CoFinder
directories:
  output: release
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/*.map'
  - '!tests/**'
  - '!docs/**'
  - '!scripts/**'
  - '!.git/**'
  - '!release/**'
  - '!**/*.log'
extraResources:
  - from: assets/icon/icon.png
    to: assets/icon/icon.png
mac:
  category: public.app-category.productivity
  icon: assets/icon/icon.icns
  target:
    - dmg
    - zip
