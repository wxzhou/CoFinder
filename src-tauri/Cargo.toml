[package]
name = "cofinder"
version = "1.9.10"
description = "CoFinder - macOS-only remote file explorer"
authors = ["CoFinder"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cofinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
